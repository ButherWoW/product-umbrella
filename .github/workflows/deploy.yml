name: Deploy to nespizdili.lol/umbrella

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed_demo:
        description: 'Seed demo offers/campaigns/clicks (only for an empty test server, never on production)'
        type: boolean
        default: false

# Checks run in parallel: each PR (and main) has its own group, a newer push to the same PR replaces the older run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HOST: 148.230.98.232

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --no-audit --no-fund
      - name: Syntax check (catches files that tests do not import, e.g. migrate.js)
        run: |
          for f in src/*.js scripts/*.mjs deploy/*.mjs public/admin/admin.js; do node --check "$f" || exit 1; done
          if grep -l $'^\xEF\xBB\xBF' src/*.js public/admin/*.js public/admin/*.html scripts/*.mjs 2>/dev/null; then echo "::error::UTF-8 BOM found in the files above"; exit 1; fi
      - run: npm test
      - name: Shellcheck deploy scripts
        run: shellcheck deploy/*.sh
      - name: Release switch simulation (first run on the old layout, rollback, pruning)
        run: sudo bash deploy/test-release-switch.sh

  postgres:
    # Same app against a real, throwaway PostgreSQL: migrations from an empty database, twice (idempotent),
    # then data must survive a server restart with an empty data directory.
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env: { POSTGRES_USER: umbrella, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: umbrella }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U umbrella" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://umbrella:ci-only-password@127.0.0.1:5432/umbrella
      TEST_DATABASE_URL: postgresql://umbrella:ci-only-password@127.0.0.1:5432/umbrella
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --no-audit --no-fund
      - name: Migrate an empty database, then again
        run: node src/migrate.js && node src/migrate.js
      - name: PostgreSQL tests
        run: node --test $(ls test/postgres*.test.mjs)

  ui:
    # Browser checks of /admin (Playwright + Chromium). Not part of `npm test`, so they run here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --no-audit --no-fund
      - name: Install Playwright (not a project dependency)
        run: npm install --no-save --no-audit --no-fund playwright@1.64.1 && npx playwright install --with-deps chromium
      - name: Admin UI (test/ui/*.mjs, each file its own server and browser)
        # Independent files, run in parallel by node --test; test/ui/setup.mjs is the shared helper, not a check.
        run: npm run test:ui

  deploy:
    needs: [test, postgres, ui]
    # Only one deploy at a time; a queued one waits instead of being dropped.
    concurrency:
      group: deploy-umbrella
      cancel-in-progress: false
    # Pull requests only run tests; production deploys happen after merge into main. A manual run
    # (workflow_dispatch) deploys only from main too, so another branch can never reach production.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # pre-deploy pg_dump + npm ci of a fresh release take longer than the old in-place deploy
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ADMIN_TOKEN: ${{ secrets.UMBRELLA_ADMIN_TOKEN }}
          POSTBACK_SECRET: ${{ secrets.UMBRELLA_POSTBACK_SECRET }}
        run: |
          missing=""
          [ -n "$SSH_PRIVATE_KEY" ] || missing="$missing SSH_PRIVATE_KEY"
          [ -n "$ADMIN_TOKEN" ] || missing="$missing UMBRELLA_ADMIN_TOKEN"
          [ -n "$POSTBACK_SECRET" ] || missing="$missing UMBRELLA_POSTBACK_SECRET"
          if [ -n "$missing" ]; then echo "::error::Add repository secrets:$missing"; exit 1; fi

      - name: Setup SSH
        env:
          # Pinned host key (ssh-keyscan output for the server, see README «Деплой»). Without it the key is
          # fetched on first contact (trust on first use) and the run shows a warning.
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "host key pinned from SSH_KNOWN_HOSTS"
          else
            echo "::warning::SSH_KNOWN_HOSTS secret is not set: trusting the host key from ssh-keyscan (TOFU). Add the secret to pin it (README «Деплой»)."
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts
          # Fail on an unknown or changed host key instead of prompting.
          printf 'Host %s\n  StrictHostKeyChecking yes\n' "$HOST" >> ~/.ssh/config

      - name: Prepare user and directories
        run: |
          ssh root@$HOST 'set -e
            id umbrella >/dev/null 2>&1 || useradd --system --home /opt/umbrella --shell /usr/sbin/nologin umbrella
            mkdir -p /opt/umbrella/releases /opt/umbrella/data
            chown -R umbrella:umbrella /opt/umbrella/data
            node -v'

      # Release-based deploy (deploy/release.sh): each commit goes to /opt/umbrella/releases/<sha>,
      # /opt/umbrella/app is a symlink to the live one. The live release is not touched until "Switch release".
      - name: Sync app into a new release
        env:
          SHA: ${{ github.sha }}
        run: |
          rsync -az --delete-after --exclude node_modules --exclude data --exclude test --exclude .git --exclude '.env*' \
            --exclude /.deployed-at --exclude /.built-lock \
            ./ "root@$HOST:/opt/umbrella/releases/$SHA/"

      - name: Adopt the old layout (first run only) and build the release
        env:
          SHA: ${{ github.sha }}
        run: |
          # adopt: a plain /opt/umbrella/app directory becomes releases/initial + symlink (no-op afterwards).
          # $SHA expands here on purpose (it is the commit hash).
          # shellcheck disable=SC2029
          ssh "root@$HOST" "set -e
            bash /opt/umbrella/releases/$SHA/deploy/release.sh adopt
            bash /opt/umbrella/releases/$SHA/deploy/release.sh build $SHA"

      - name: Write env file
        env:
          ADMIN_TOKEN: ${{ secrets.UMBRELLA_ADMIN_TOKEN }}
          POSTBACK_SECRET: ${{ secrets.UMBRELLA_POSTBACK_SECRET }}
        run: |
          umask 077
          {
            echo "PORT=4110"
            echo "BASE_PATH=/umbrella"
            echo "TRUST_PROXY=1"
            echo "DATA_DIR=/opt/umbrella/data"
            echo "CLICK_RATE_LIMIT=120"
            echo "REQUIRE_LOGIN=1"
            echo "GEOIP_DB=/opt/umbrella/geo/country.mmdb"
            echo "GEOIP_ASN_DB=/opt/umbrella/geo/asn.mmdb"
            echo "PRIMARY_HOST=nespizdili.lol"
            echo "ADMIN_TOKEN=$ADMIN_TOKEN"
            echo "POSTBACK_SECRET=$POSTBACK_SECRET"
          } > umbrella.env
          rsync -az umbrella.env root@$HOST:/opt/umbrella/.env.base
          rm umbrella.env

      - name: Own database (separate PostgreSQL role + database), env file, pre-deploy dump, migrations
        env:
          SHA: ${{ github.sha }}
        run: |
          # Migrations are forward-only. The dump taken right before them (backups/pre-deploy-<sha>.dump,
          # last 5 kept) is what a code rollback after a schema change relies on — see README «Бэкапы».
          # shellcheck disable=SC2029
          ssh "root@$HOST" "REL=/opt/umbrella/releases/$SHA SHA=$SHA bash -s" <<'REMOTE'
          set -e
          umask 027
          DBLINE=$(bash "$REL/deploy/setup-db.sh")
          {
            cat /opt/umbrella/.env.base
            if [ -n "$DBLINE" ]; then
              echo "$DBLINE"
              # With a database configured the tracker must never fall back to JSONL silently.
              echo "REQUIRE_POSTGRES=1"
            fi
          } > /opt/umbrella/.env
          rm /opt/umbrella/.env.base
          chown root:umbrella /opt/umbrella/.env && chmod 640 /opt/umbrella/.env
          if grep -q "^DATABASE_URL=" /opt/umbrella/.env; then
            bash "$REL/deploy/release.sh" dump "$SHA"
            set -a; . /opt/umbrella/.env; set +a
            cd "$REL" && node src/migrate.js
          else
            echo "storage: JSONL in /opt/umbrella/data"
          fi
          REMOTE

      - name: GeoIP databases (DB-IP Country + ASN Lite, CC BY 4.0) — refresh monthly
        run: |
          ssh root@$HOST 'set -e
            mkdir -p /opt/umbrella/geo && cd /opt/umbrella/geo
            fetch_db() { # $1 = DB-IP edition (country-lite / asn-lite), $2 = target file
              if [ -s "$2" ] && [ -z "$(find "$2" -mtime +30)" ]; then echo "$2 is fresh"; return 0; fi
              for month in $(date -u +%Y-%m) $(date -u -d "-1 month" +%Y-%m); do
                if curl -sfL --max-time 120 -o new.mmdb.gz "https://download.db-ip.com/free/dbip-$1-${month}.mmdb.gz"; then
                  gunzip -f new.mmdb.gz
                  if [ "$(stat -c %s new.mmdb)" -gt 1000000 ]; then chmod 644 new.mmdb; mv new.mmdb "$2"; echo "$2 updated (${month})"; return 0; fi
                fi
              done
              rm -f new.mmdb new.mmdb.gz
              echo "::warning::$1 download failed; keeping the previous database if any"
            }
            fetch_db country-lite country.mmdb
            fetch_db asn-lite asn.mmdb'

      - name: Switch release (symlink, restart, health check, rollback on failure)
        env:
          SHA: ${{ github.sha }}
        run: |
          # /health must answer ok (and storage postgres when DATABASE_URL is set) within 20 s; otherwise the
          # symlink goes back to the previous release, the service restarts on it and this job fails.
          # shellcheck disable=SC2029
          ssh "root@$HOST" "set -e
            bash /opt/umbrella/releases/$SHA/deploy/release.sh activate $SHA
            bash /opt/umbrella/releases/$SHA/deploy/release.sh prune
            ls -l /opt/umbrella/app"

      - name: Verify storage
        run: |
          ssh root@$HOST 'storage=$(curl -s http://127.0.0.1:4110/health | sed -n "s/.*\"storage\":\"\([a-z]*\)\".*/\1/p")
            echo "storage: $storage"
            if grep -q "^DATABASE_URL=" /opt/umbrella/.env && [ "$storage" != postgres ]; then
              echo "DATABASE_URL is set but the service is not using PostgreSQL:"
              journalctl -u umbrella -n 30 --no-pager | grep -E "\[db\]|Error|error" | sed -E "s#postgresql://[^@ ]*@#postgresql://***@#g"
              exit 1
            fi'

      - name: Wire nginx (backup, include once, test, rollback on failure)
        run: |
          ssh root@$HOST 'set -e
            install -m 644 /opt/umbrella/app/deploy/nginx-umbrella.conf /etc/nginx/snippets/umbrella.conf
            SITE=$(grep -lE "server_name[^;]*nespizdili\.lol" /etc/nginx/sites-enabled/* /etc/nginx/conf.d/*.conf 2>/dev/null | head -1)
            [ -n "$SITE" ] || { echo "nespizdili.lol server block not found"; exit 1; }
            SITE=$(readlink -f "$SITE")
            if ! grep -q "include snippets/umbrella.conf;" "$SITE"; then
              cp "$SITE" "/root/nginx-before-umbrella-$(date +%Y%m%d%H%M%S).conf"
              cp "$SITE" /tmp/umbrella-site.bak
              sed -i -E "/server_name[^;]*nespizdili\.lol/a\    include snippets/umbrella.conf;" "$SITE"
            fi
            if nginx -t; then systemctl reload nginx; echo "nginx reloaded"
            else
              [ -f /tmp/umbrella-site.bak ] && cp /tmp/umbrella-site.bak "$SITE"
              nginx -t && systemctl reload nginx
              echo "nginx config rejected, rolled back"; exit 1
            fi
            rm -f /tmp/umbrella-site.bak'

      - name: Tracking domains (deploy/domains.txt) — nginx block + Let's Encrypt, panel not exposed
        run: |
          ssh root@$HOST 'set -e
            LIST=/opt/umbrella/app/deploy/domains.txt
            grep -vE "^[[:space:]]*(#|$)" "$LIST" 2>/dev/null | tr -d "\r" | tr "[:upper:]" "[:lower:]" | while read -r d; do
              echo "$d" | grep -qE "^([a-z0-9-]+\.)+[a-z]{2,63}$" || { echo "skip invalid: $d"; continue; }
              ip=$(getent ahostsv4 "$d" | awk "{print \$1; exit}")
              if [ -z "$ip" ] || ! hostname -I | tr " " "\n" | grep -qx "$ip"; then echo "::warning::$d resolves to ${ip:-nothing}, not this server — skipped"; continue; fi
              conf=/etc/nginx/sites-available/umbrella-$d.conf
              if [ ! -f "$conf" ]; then
                sed "s/__DOMAIN__/$d/g" /opt/umbrella/app/deploy/nginx-tracking-domain.conf > "$conf"
                ln -sf "$conf" "/etc/nginx/sites-enabled/umbrella-$d.conf"
                if ! nginx -t; then rm -f "/etc/nginx/sites-enabled/umbrella-$d.conf" "$conf"; echo "::warning::nginx rejected $d, rolled back"; continue; fi
                systemctl reload nginx
                echo "nginx block added: $d"
              fi
              command -v certbot >/dev/null || { apt-get update -qq && apt-get install -y -qq certbot python3-certbot-nginx; }
              certbot --nginx -d "$d" --non-interactive --agree-tos --register-unsafely-without-email --redirect --keep-until-expiring \
                || echo "::warning::certificate for $d failed (domain stays on http)"
            done
            nginx -t && systemctl reload nginx'

      - name: Nightly backup (systemd timer, 14 days kept on the server) + monthly restore test
        run: |
          ssh root@$HOST 'set -e
            for u in umbrella-backup.service umbrella-backup.timer umbrella-failed@.service \
                     umbrella-restore-test.service umbrella-restore-test.timer; do
              install -m 644 "/opt/umbrella/app/deploy/$u" "/etc/systemd/system/$u"
            done
            systemctl daemon-reload
            systemctl enable --quiet --now umbrella-backup.timer
            # Monthly: restore the latest dump into umbrella_restore_test, count rows, drop it. Failures of either
            # job are written to /opt/umbrella/backups/LAST_FAILED (and journald), no external service.
            systemctl enable --quiet --now umbrella-restore-test.timer
            if [ -f /opt/umbrella/backups/LAST_FAILED ]; then echo "::warning::$(tail -3 /opt/umbrella/backups/LAST_FAILED)"; fi
            # First run right away so a broken backup shows up in this deploy, not weeks later.
            if [ -z "$(find /opt/umbrella/backups -maxdepth 1 -name "umbrella-*" -mtime -1 2>/dev/null)" ]; then
              systemctl start umbrella-backup.service
              journalctl -u umbrella-backup -n 3 --no-pager -o cat
            fi
            ls -lh /opt/umbrella/backups | tail -4
            systemctl list-timers umbrella-backup.timer --no-pager | head -2'

      # Never on a normal production deploy: only a manual run with seed_demo = true (for an empty test server).
      - name: Seed demo data (manual runs with seed_demo only)
        if: github.event_name == 'workflow_dispatch' && inputs.seed_demo
        run: |
          ssh root@$HOST 'cd /opt/umbrella/app && set -a && . /opt/umbrella/.env && set +a && node deploy/seed-demo.mjs http://127.0.0.1:4110'

      - name: Public check
        run: |
          for path in login campaigns; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://nespizdili.lol/umbrella/$path")
            echo "https://nespizdili.lol/umbrella/$path -> $code"
            [ "$code" = 200 ] || exit 1
          done
          curl -sf https://nespizdili.lol/ -o /dev/null && echo "main site still ok"
