# Tracking domain for Umbrella. Only tracking routes reach the app; the panel and APIs are not served here.
# __DOMAIN__ is replaced by the deploy workflow; certbot adds the HTTPS server block.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ~ ^/(r/|lp/click$|postback$|health$) {
        proxy_pass http://127.0.0.1:4110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    location / { return 404; }
}
