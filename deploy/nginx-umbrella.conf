# Included into the nespizdili.lol server block. The prefix is stripped before proxying;
# the app knows its public prefix from BASE_PATH=/umbrella.
# Panel pages, their files and the demo answer 404 without the PIN pass from the stub page on "/": nginx asks
# /_gate/check/<door> (Bananabun's nginx-banana.conf and backend) on every request. Tracking, postbacks, /health and
# the API (which has its own keys and sessions; signing in is behind the PIN too) stay open.
location = /umbrella { return 404; }
location @umbrella_closed { return 404; }
location /umbrella/ {
    auth_request /_gate/check/ul;
    error_page 401 403 = @umbrella_closed;
    proxy_pass http://127.0.0.1:4110/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
}
location ^~ /umbrella/demo {
    auth_request /_gate/check/ud;
    error_page 401 403 = @umbrella_closed;
    proxy_pass http://127.0.0.1:4110/demo;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ~ ^/umbrella(/(?:r/|lp/click$|postback$|health$|stats(?:/|$)|api/(?!auth/)).*)$ {
    rewrite ^/umbrella(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:4110;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
}
