# Included into the nespizdili.lol server block. The prefix is stripped before proxying;
# the app knows its public prefix from BASE_PATH=/umbrella.
location = /umbrella { return 302 /umbrella/admin; }
location /umbrella/ {
    proxy_pass http://127.0.0.1:4110/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
}
